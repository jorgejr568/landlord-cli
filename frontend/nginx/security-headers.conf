# Baseline HTTP response headers for the Rentivo single-page application.
#
# Nginx replaces the entire inherited add_header set the moment a block
# declares an add_header of its own, so this snippet is included by every
# block in default.conf instead of being declared once at server level.
# "always" keeps the headers on error responses such as the /assets/ 404.
#
# Enforced policy: only directives that cannot break a working page. The app
# has no <base> element, no <object>/<embed>, and no cross-origin form action,
# and it is never framed. X-Frame-Options below is the legacy companion to
# frame-ancestors for older browsers.
add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

# Resource policy: report-only until a production observation window confirms
# it. Cloudflare Turnstile and Google Tag Manager are disabled in every
# automated environment, so no test can prove this policy keeps login and
# analytics working. Promote it to Content-Security-Policy only after the
# report-only header has run clean in production. See docs/development.md.
#
#   script-src  www.googletagmanager.com   -> src/features/auth/analytics.ts
#               challenges.cloudflare.com  -> src/features/auth/Turnstile.tsx
#   style-src   fonts.googleapis.com       -> index.html stylesheet link
#               'unsafe-inline'            -> Turnstile injects widget styles
#   font-src    fonts.gstatic.com          -> Google Fonts woff2 files
#   img-src     data:                      -> TOTP QR code and the CSS chevron
#   connect-src Google hosts               -> GA4 measurement through GTM
#   frame-src   blob:                      -> theme PDF preview iframe
#               challenges.cloudflare.com  -> Turnstile widget iframe
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net; frame-src 'self' blob: https://challenges.cloudflare.com" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
