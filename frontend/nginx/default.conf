# Serve Vite assets directly and return index.html for client-side routes.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Covers responses produced outside the blocks below.
    include /etc/nginx/rentivo-security-headers.conf;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/rentivo-security-headers.conf;
    }

    # try_files below falls back to the /index.html URI, which makes nginx run
    # an internal redirect back into this exact-match block. This block is
    # therefore what actually serves the SPA document for every client-side
    # route, and its own add_header would discard the inherited header set
    # unless the snippet is repeated here.
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/rentivo-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/rentivo-security-headers.conf;
    }
}
