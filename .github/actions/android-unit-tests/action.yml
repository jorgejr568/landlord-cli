name: Android unit tests
description: Build the Rentivo Android app, run its JVM unit tests and lint, and verify the OpenAPI contract copy.

runs:
  using: composite
  steps:
    # Gradle needs a JDK 21 toolchain; the runner image default is not pinned
    # to it, so the toolchain is installed explicitly rather than inherited.
    - name: Install JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    # setup-gradle owns the Gradle user home cache (wrapper distribution,
    # dependencies, and build cache) keyed on the build files.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    # android/local.properties is gitignored and therefore absent in CI. The
    # ubuntu runner images ship the Android SDK preinstalled with ANDROID_HOME
    # exported, which Gradle falls back to when sdk.dir is undeclared, so no
    # SDK installation or local.properties generation is needed here.
    - name: Build, test, and lint the Android app
      shell: bash
      working-directory: android
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
    - name: Verify Android OpenAPI contract copy is current
      shell: bash
      working-directory: android
      run: ../scripts/sync-android-openapi.sh check
