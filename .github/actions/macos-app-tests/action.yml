name: macOS app tests
description: Build and test the native macOS app against the RentivoCore package.

runs:
  using: composite
  steps:
    # Beta toolchains are excluded deliberately: the runner images ship a beta
    # alongside the release, and `Xcode_26.0_beta.app` sorts after
    # `Xcode_16.4.app`; a beta toolchain is not what the app ships from.
    #
    # Unlike the iOS job this needs no simulator — `platform=macOS` runs on the
    # runner itself — so the newest non-beta Xcode is simply selected, with the
    # image default as the fallback when no versioned Xcode is installed.
    - name: Select the newest non-beta Xcode
      shell: bash
      run: |
        set -euo pipefail
        candidates="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -Vr || true)"
        candidates="$(printf '%s\n/Applications/Xcode.app\n' "$candidates" | grep -v '^$')"
        for xcode in $candidates; do
          [ -d "$xcode" ] || continue
          sudo xcode-select -s "$xcode"
          echo "Selected $xcode"
          xcodebuild -version
          exit 0
        done
        echo "No usable Xcode is installed on this runner." >&2
        ls -d /Applications/Xcode*.app >&2 || true
        exit 1
    # The macOS app links the RentivoCore package from ios/, which xcodebuild
    # resolves into DerivedData. Caching it keyed on the manifest keeps the
    # package build off the critical path; the key falls back to any previous
    # macOS DerivedData so an unchanged dependency graph still warm-starts.
    - name: Cache macOS DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-macos-derived-${{ hashFiles('ios/Package.swift', 'macos/Rentivo.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-macos-derived-
    # `make macos-test` keeps the unsigned unit-test build separate from the signed UI-test
    # runner. The UI runner must be signed so XCTest can launch and drive the app.
    - name: Build and run the macOS app tests
      shell: bash
      run: make macos-test
